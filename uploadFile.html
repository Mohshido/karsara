<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'sha256-Lpip/znqiqrsHFb89kkJogi0nvSXQY+kZLbvssHD6uc='; style-src-attr 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <link rel="stylesheet" href="accessibility.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آپلود فایل</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f2f5;
        padding: 1rem;
      }

      .upload-box {
        max-width: 500px;
        width: 100%;
        background-color: #ffffff;
        box-shadow:
          0 20px 40px -12px rgba(0, 0, 0, 0.15),
          0 4px 18px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        transition:
          transform 0.25s ease,
          box-shadow 0.3s ease;
        border: 1px solid rgba(128, 128, 128, 0.15);
      }

      .box-header {
        background: linear-gradient(135deg, #7b3f9e, #9f5fc9);
        padding: 1.2rem 2rem;
        border-bottom: 2px solid #d1c4e9;

        & h2 {
          font-size: 1.4rem;
          font-weight: 600;
          color: #ffffff;
          text-align: center;
        }
      }

      .upload-content {
        padding: 2rem 2rem 2.2rem;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
      }

      .file-input-wrapper {
        position: relative;
        width: 100%;

        & input[type="file"] {
          width: 100%;
          height: 100%;
          position: absolute;
          inset: 0;
          opacity: 0;
          cursor: pointer;
          z-index: 2;
        }
      }

      .file-drop-zone {
        width: 100%;
        padding: 2.2rem;
        background: #f8f6fc;
        border: 2px dashed #b39ddb;
        text-align: center;
        color: #4a2c5e;
        transition: all 0.25s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 1;

        & .main-text {
          font-weight: 500;
          font-size: 1.05rem;
          color: #3a2a48;
        }

        & .sub-text {
          font-size: 0.95rem;
          color: #88809c;
        }
      }

      .add-btn {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #7b3f9e, #8e4fb3);
        border: none;
        color: #ffffff;
        font-size: 1.2rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 6px 14px rgba(123, 63, 158, 0.3);
        letter-spacing: 1px;

        &:hover {
          background-color: linear-gradient(135deg, #6a328a, #7b3f9e);
          transform: scale(1.01);
          box-shadow: 0 10px 20px rgba(123, 63, 158, 0.4);
        }

        &:active {
          transform: scale(0.96);
        }

        & .plus-icon {
          display: inline-block;
          font-size: 1.6rem;
          font-weight: 300;
          line-height: 1;
          margin-top: -3px;
        }
      }

      .file-name-display {
        margin-top: -0.8rem;
        font-size: 0.9rem;
        color: #5a4a6e;
        background-color: #f0ebf7;
        padding: 0.4rem 1rem;
        display: inline-block;
        align-self: flex-start;
        border: 1px solid #d1c4e9;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: all 0.2s;

        &:empty {
          display: none;
        }
      }

      #toast {
        display: none;
      }

      #toast.show-toast {
        display: block;
        width: max-content;
        height: auto;
        color: #fff;
        background-color: #6a328a;
        backdrop-filter: blur(2px);
        padding: 1.1rem;
        position: fixed;
        top: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="upload-box">
      <header class="box-header">
        <h2 aria-label="فایل را در قسمت زیر اضافه کنید">فایل را اضافه کنید</h2>
      </header>
      <form class="upload-content">
        <div class="file-input-wrapper">
          <input
            type="file"
            name="file-input"
            id="fileInput"
            accept=".pdf"
            aria-label="انتخاب یک فایل PDF"
          />
          <div class="file-drop-zone" id="dropZone">
            <span class="main-text" aria-label="اینجا کلیک کنید"
              >فایل خود را انتخاب کنید</span
            >
            <span class="sub-text">یا اینجا کلیک کنید</span>
          </div>
        </div>
        <div class="file-name-display" id="fileNameDisplay"></div>

        <button class="add-btn" id="addBtn">
          <span
            class="font-size:1.1rem;font-weight:400;"
            aria-label="دکمه افزودن فایل"
            >افزودن</span
          >
          <span class="plus-icon">+</span>
        </button>
      </form>
    </div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="shared.js"></script>
    <script src="uploadFile.js"></script>
  </body>
</html>
